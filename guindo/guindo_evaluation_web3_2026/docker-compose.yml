services:

  # ─── Base de données PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: certichain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certichain
      POSTGRES_USER: certichain
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - certichain_network

  # ─── Backend Laravel (PHP-FPM) ────────────────────────────────────────────
  laravel_app:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: certichain_laravel
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend-laravel:/var/www
    depends_on:
      - postgres
    networks:
      - certichain_network

  # ─── Nginx (reverse proxy pour Laravel) ──────────────────────────────────
  laravel_nginx:
    image: nginx:alpine
    container_name: certichain_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend-laravel:/var/www
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel_app
    networks:
      - certichain_network

  # ─── Frontend Next.js ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    container_name: certichain_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - laravel_nginx
    networks:
      - certichain_network

volumes:
  postgres_data:

networks:
  certichain_network:
    driver: bridge
