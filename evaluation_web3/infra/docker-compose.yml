# CertiChain — stack locale (évaluation Web3)
# Activer progressivement : db seul fonctionne sans backend/frontend.

services:
  db:
    image: postgres:16-alpine
    container_name: certichain_db
    environment:
      POSTGRES_DB: certichain
      POSTGRES_USER: certichain
      POSTGRES_PASSWORD: certichain_secret
    ports:
      # Hôte : port élevé pour éviter les plages réservées par Windows (ex. 54xx)
      - "15432:5432"
    volumes:
      - certichain_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - certichain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certichain -d certichain"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api-fastapi
      dockerfile: Dockerfile
    container_name: certichain_api
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://certichain:certichain_secret@db:5432/certichain
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - certichain

  # Décommentez quand ../backend contient un projet Laravel avec Dockerfile
  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: certichain_backend
  #   volumes:
  #     - ../backend:/var/www/html
  #   ports:
  #     - "8002:8001"
  #   environment:
  #     DB_CONNECTION: pgsql
  #     DB_HOST: db
  #     DB_PORT: 5432
  #     DB_DATABASE: certichain
  #     DB_USERNAME: certichain
  #     DB_PASSWORD: certichain_secret
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - certichain

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: certichain_frontend
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Le navigateur sur la machine hôte appelle l’API exposée sur le port 8002
      NEXT_PUBLIC_API_URL: http://localhost:8002
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - certichain

  # Décommentez avec backend + frontend pour un point d'entrée unique
  # nginx:
  #   image: nginx:alpine
  #   container_name: certichain_nginx
  #   ports:
  #     - "8000:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ../backend:/var/www/html
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - certichain

volumes:
  certichain_pgdata:
  frontend_node_modules:

networks:
  certichain:
    driver: bridge
