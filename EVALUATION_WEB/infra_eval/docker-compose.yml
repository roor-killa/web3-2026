name: infra_eval

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: eval_postgres_db
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5433:5432"  # ⚠️ changé pour éviter conflit avec l'autre projet
    volumes:
      - db_data_eval:/var/lib/postgresql/data
    networks:
      - app_network_eval
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel_user -d laravel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Laravel
  backend:
    build:
      context: ../back-laravel
      dockerfile: Dockerfile
    container_name: eval_laravel_backend
    volumes:
      - ../back-laravel:/var/www/html
    ports:
      - "8002:8001"  # ⚠️ changé
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network_eval
    command: sh -c "php-fpm & php artisan serve --host=0.0.0.0 --port=8001"

  # Frontend NextJS
  frontend:
    build:
      context: ../front-next
      dockerfile: Dockerfile
    container_name: eval_nextjs_frontend
    volumes:
      - ../front-next:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8005/api
    ports:
      - "3001:3000"  # ⚠️ changé
    networks:
      - app_network_eval

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: eval_nginx_proxy
    ports:
      - "8005:80"  # ⚠️ changé
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../back-laravel:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - app_network_eval

  pgadmin:
    image: dpage/pgadmin4
    container_name: eval_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app_network_eval


volumes:
  db_data_eval:

networks:
  app_network_eval:
    driver: bridge

