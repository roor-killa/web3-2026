version: "3.9"

services:
  php:
    image: php:8.3-fpm
    container_name: php_app
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_app
    ports:
      - "3000:3000"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - frontend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
