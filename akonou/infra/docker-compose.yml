version: "3.9"

services:
  # =====================================================
  # PostgreSQL (partagé Laravel + FastAPI)
  # =====================================================
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel_user -d laravel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # FastAPI - Scraper Python
  # =====================================================
  fastapi:
    build:
      context: ../projet
      dockerfile: Dockerfile
    container_name: kiprix_fastapi
    command: python -m uvicorn fastapi_app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://laravel_user:laravel_password@db:5432/laravel_db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../projet:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # =====================================================
  # Backend Laravel (PHP-FPM)
  # =====================================================
  backend:
    build:
      context: ../back-laravel
      dockerfile: Dockerfile
    container_name: laravel_backend
    working_dir: /var/www/html
    volumes:
      - ../back-laravel:/var/www/html
    ports:
      - "9000:9000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_password
      FASTAPI_URL: http://kiprix_fastapi:8000
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started
    networks:
      - app_network

  # =====================================================
  # Frontend Next.js
  # =====================================================
  frontend:
    build:
      context: ../front-next
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    volumes:
      - ../front-next:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    networks:
      - app_network

  # =====================================================
  # Nginx Reverse Proxy
  # =====================================================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8000:80"
    volumes:
      - ./server.conf:/etc/nginx/conf.d/default.conf
      - ../back-laravel:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
